<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>clipnest — 剪贴板历史</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e6e8ec;
    --text: #1a1d21;
    --muted: #6b7280;
    --accent: #4f46e5;
    --accent-soft: #eef0fe;
    --danger: #dc2626;
    --radius: 10px;
    --mono: ui-monospace, "Cascadia Code", Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex: 0 0 auto;
  }
  .brand { display: flex; align-items: baseline; gap: 8px; }
  .brand h1 { margin: 0; font-size: 17px; letter-spacing: -0.2px; }
  .brand span { color: var(--muted); font-size: 12px; }
  .search {
    flex: 1 1 auto;
    max-width: 420px;
    position: relative;
  }
  .search input {
    width: 100%;
    padding: 8px 12px 8px 32px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fbfbfc;
    font: inherit;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .search input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
    background: #fff;
  }
  .search svg { position: absolute; left: 10px; top: 9px; opacity: .45; }
  .stats { margin-left: auto; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .stats b { color: var(--text); font-weight: 600; }

  main {
    flex: 1 1 auto;
    display: flex;
    gap: 14px;
    padding: 14px;
    min-height: 0;
  }

  .list-panel {
    flex: 0 0 400px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow-y: auto;
    padding: 6px;
  }
  .list-panel::-webkit-scrollbar, pre::-webkit-scrollbar { width: 8px; height: 8px; }
  .list-panel::-webkit-scrollbar-thumb, pre::-webkit-scrollbar-thumb {
    background: #d6d9e0; border-radius: 4px;
  }

  .item {
    position: relative;
    padding: 9px 10px 9px 14px;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: background .12s;
  }
  .item + .item { margin-top: 2px; }
  .item:hover { background: #f7f8fa; }
  .item.active { background: var(--accent-soft); border-color: #dcdffb; }
  .item.active::before {
    content: "";
    position: absolute; left: 4px; top: 12px; bottom: 12px;
    width: 3px; border-radius: 2px; background: var(--accent);
  }
  .item-top { display: flex; align-items: center; gap: 7px; }
  .badge {
    flex: 0 0 auto;
    font-size: 10.5px;
    padding: 1px 6px;
    border-radius: 5px;
    font-weight: 600;
    letter-spacing: .2px;
  }
  .badge.text  { background: #f1f2f4; color: #55606e; }
  .badge.url   { background: #e8f0fe; color: #1d4ed8; }
  .badge.code  { background: #f3ecfe; color: #7c3aed; }
  .badge.path  { background: #fdf1e3; color: #b45309; }
  .badge.json  { background: #e4f6f4; color: #0f766e; }
  .badge.email { background: #e8f7ea; color: #15803d; }
  .badge.color { background: #fdeaf2; color: #be185d; }
  .summary {
    flex: 1 1 auto;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 13.5px;
  }
  .pin-mark { color: #f59e0b; flex: 0 0 auto; }
  .meta {
    display: flex;
    gap: 10px;
    color: var(--muted);
    font-size: 11.5px;
    margin-top: 3px;
    padding-left: 1px;
  }
  .actions {
    position: absolute;
    right: 8px; top: 8px;
    display: none;
    gap: 2px;
    background: inherit;
    padding-left: 12px;
  }
  .item:hover .actions { display: flex; }
  .iconbtn {
    border: none;
    background: transparent;
    cursor: pointer;
    color: var(--muted);
    font-size: 13px;
    line-height: 1;
    padding: 4px 6px;
    border-radius: 5px;
  }
  .iconbtn:hover { background: #e9ebf0; color: var(--text); }
  .iconbtn.del:hover { background: #fdeaea; color: var(--danger); }
  .iconbtn.on { color: #f59e0b; }

  .preview-panel {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    min-width: 0;
    overflow: hidden;
  }
  .preview-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
  }
  .preview-head .grow { flex: 1 1 auto; }
  pre {
    flex: 1 1 auto;
    margin: 0;
    padding: 16px 18px;
    overflow: auto;
    font: 13px/1.65 var(--mono);
    white-space: pre-wrap;
    word-break: break-word;
    tab-size: 4;
  }
  .empty {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    gap: 6px;
    font-size: 13px;
  }
  .empty kbd {
    font: 11px var(--mono);
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 5px;
    background: #fafbfc;
  }
  footer {
    flex: 0 0 auto;
    padding: 6px 20px 10px;
    color: var(--muted);
    font-size: 11.5px;
    display: flex;
    gap: 14px;
    align-items: center;
  }
  footer .spacer { flex: 1 1 auto; }
  .btn {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    font: inherit;
    font-size: 12.5px;
    padding: 5px 11px;
    border-radius: 7px;
    cursor: pointer;
  }
  .btn:hover { background: #f7f8fa; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn:disabled { opacity: .45; cursor: default; }

  #toast {
    position: fixed;
    left: 50%;
    bottom: 42px;
    transform: translate(-50%, 12px);
    background: #1f2430;
    color: #fff;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 12.5px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s, transform .18s;
    z-index: 20;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>clipnest</h1>
    <span>v__VERSION__</span>
  </div>
  <div class="search">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" />
    </svg>
    <input id="q" type="search" placeholder="搜索历史…（按 / 聚焦）" autocomplete="off" />
  </div>
  <div class="stats" id="stats">载入中…</div>
</header>

<main>
  <div class="list-panel" id="list"></div>
  <div class="preview-panel">
    <div class="preview-head">
      <span id="preview-meta">未选择</span>
      <span class="grow"></span>
      <button class="btn" id="btn-pin" disabled>置顶</button>
      <button class="btn primary" id="btn-copy" disabled>复制</button>
    </div>
    <pre id="preview"></pre>
    <div class="empty" id="empty">
      <div>这里会显示选中的片段</div>
      <div>用 <kbd>/</kbd> 搜索 · <kbd>↑</kbd><kbd>↓</kbd> 切换 · <kbd>Enter</kbd> 复制</div>
    </div>
  </div>
</main>

<footer>
  <span>数据只存在本机 SQLite，敏感内容（密钥 / 密码 / 身份证号）不会入库</span>
  <span class="spacer"></span>
  <button class="btn" id="btn-purge">清理 30 天前</button>
</footer>
<div id="toast"></div>

<script>
(() => {
  const KIND_LABEL = {
    text: "TEXT", url: "URL", code: "CODE", path: "PATH",
    json: "JSON", email: "MAIL", color: "CLR"
  };

  const state = { clips: [], selected: null, signature: "" };
  const el = {
    list: document.getElementById("list"),
    q: document.getElementById("q"),
    stats: document.getElementById("stats"),
    preview: document.getElementById("preview"),
    previewMeta: document.getElementById("preview-meta"),
    empty: document.getElementById("empty"),
    toast: document.getElementById("toast"),
    btnPin: document.getElementById("btn-pin"),
    btnCopy: document.getElementById("btn-copy"),
    btnPurge: document.getElementById("btn-purge"),
  };

  function toast(message) {
    el.toast.textContent = message;
    el.toast.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.toast.classList.remove("show"), 1600);
  }

  function ago(ts) {
    const delta = Date.now() / 1000 - ts;
    if (delta < 60) return Math.max(0, Math.floor(delta)) + " 秒前";
    if (delta < 3600) return Math.floor(delta / 60) + " 分钟前";
    if (delta < 86400) return Math.floor(delta / 3600) + " 小时前";
    return Math.floor(delta / 86400) + " 天前";
  }

  function esc(text) {
    return String(text).replace(/[&<>"']/g, (ch) => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]
    ));
  }

  async function api(path, options) {
    const response = await fetch(path, options);
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || response.statusText);
    return data;
  }

  async function load(force) {
    let url = "/api/clips?limit=500";
    const query = el.q.value.trim();
    if (query) url += "&q=" + encodeURIComponent(query);
    try {
      const data = await api(url);
      const signature = data.clips.map((c) => c.id + ":" + c.hits + ":" + (c.pinned ? 1 : 0)).join(",");
      if (!force && signature === state.signature) return;
      state.signature = signature;
      state.clips = data.clips;
      if (!state.clips.some((c) => c.id === state.selected)) {
        state.selected = state.clips.length ? state.clips[0].id : null;
      }
      render();
      renderPreview();
    } catch (error) {
      toast("拉取失败：" + error.message);
    }
  }

  function render() {
    if (!state.clips.length) {
      el.list.innerHTML = '<div class="empty" style="height:200px">没有匹配的条目</div>';
      return;
    }
    const scrollTop = el.list.scrollTop;
    el.list.innerHTML = state.clips.map((clip) => `
      <div class="item ${clip.id === state.selected ? "active" : ""}" data-id="${clip.id}">
        <div class="item-top">
          <span class="badge ${clip.kind}">${KIND_LABEL[clip.kind] || clip.kind}</span>
          <span class="summary">${esc(clip.preview)}</span>
          ${clip.pinned ? '<span class="pin-mark">★</span>' : ""}
        </div>
        <div class="meta">
          <span>${ago(clip.last_used_at)}</span>
          <span>复制 ${clip.hits} 次</span>
          ${clip.lines > 1 ? `<span>${clip.lines} 行</span>` : ""}
        </div>
        <div class="actions">
          <button class="iconbtn ${clip.pinned ? "on" : ""}" data-act="pin" data-id="${clip.id}" title="置顶/取消">★</button>
          <button class="iconbtn" data-act="copy" data-id="${clip.id}" title="复制">⧉</button>
          <button class="iconbtn del" data-act="del" data-id="${clip.id}" title="删除">✕</button>
        </div>
      </div>`).join("");
    el.list.scrollTop = scrollTop;
  }

  function current() {
    return state.clips.find((clip) => clip.id === state.selected) || null;
  }

  function renderPreview() {
    const clip = current();
    el.btnPin.disabled = !clip;
    el.btnCopy.disabled = !clip;
    if (!clip) {
      el.preview.textContent = "";
      el.preview.style.display = "none";
      el.empty.style.display = "flex";
      el.previewMeta.textContent = "未选择";
      return;
    }
    el.empty.style.display = "none";
    el.preview.style.display = "block";
    el.preview.textContent = clip.content;
    el.previewMeta.textContent =
      `${KIND_LABEL[clip.kind] || clip.kind} · ${clip.content.length} 字符 · ${clip.lines} 行 · 复制 ${clip.hits} 次`;
    el.btnPin.textContent = clip.pinned ? "取消置顶" : "置顶";
  }

  function select(id) {
    state.selected = id;
    document.querySelectorAll(".item").forEach((node) => {
      node.classList.toggle("active", Number(node.dataset.id) === id);
    });
    renderPreview();
  }

  async function copy(clip) {
    try {
      await api(`/api/clips/${clip.id}/copy`, { method: "POST" });
      toast("已复制到剪贴板");
      await load(true);
    } catch (error) {
      toast("复制失败：" + error.message);
    }
  }

  async function togglePin(clip) {
    try {
      await api(`/api/clips/${clip.id}/pin`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pinned: !clip.pinned }),
      });
      await load(true);
    } catch (error) {
      toast("操作失败：" + error.message);
    }
  }

  async function remove(clip) {
    try {
      await api(`/api/clips/${clip.id}`, { method: "DELETE" });
      toast("已删除");
      await load(true);
    } catch (error) {
      toast("删除失败：" + error.message);
    }
  }

  el.list.addEventListener("click", (event) => {
    const button = event.target.closest("[data-act]");
    const row = event.target.closest(".item");
    if (!row) return;
    const id = Number(row.dataset.id);
    const clip = state.clips.find((item) => item.id === id);
    if (!clip) return;
    if (button) {
      event.stopPropagation();
      const action = button.dataset.act;
      if (action === "pin") togglePin(clip);
      else if (action === "copy") copy(clip);
      else if (action === "del") remove(clip);
      return;
    }
    select(id);
  });

  el.btnCopy.addEventListener("click", () => {
    const clip = current();
    if (clip) copy(clip);
  });

  el.btnPin.addEventListener("click", () => {
    const clip = current();
    if (clip) togglePin(clip);
  });

  el.btnPurge.addEventListener("click", async () => {
    try {
      const result = await api("/api/purge", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ days: 30, keep_pinned: true }),
      });
      toast(`已清理 ${result.removed} 条`);
      await load(true);
    } catch (error) {
      toast("清理失败：" + error.message);
    }
  });

  let searchTimer = null;
  el.q.addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => load(true), 180);
  });

  document.addEventListener("keydown", (event) => {
    const typing = event.target.tagName === "INPUT";
    if (event.key === "/" && !typing) {
      event.preventDefault();
      el.q.focus();
      return;
    }
    if (event.key === "Escape") {
      el.q.value = "";
      el.q.blur();
      load(true);
      return;
    }
    if (event.key === "ArrowDown" || event.key === "ArrowUp") {
      if (!state.clips.length) return;
      event.preventDefault();
      const index = state.clips.findIndex((clip) => clip.id === state.selected);
      const next = event.key === "ArrowDown"
        ? Math.min(state.clips.length - 1, index + 1)
        : Math.max(0, index - 1);
      select(state.clips[next].id);
      const node = document.querySelector(`.item[data-id="${state.clips[next].id}"]`);
      if (node) node.scrollIntoView({ block: "nearest" });
      return;
    }
    if (event.key === "Enter" && !typing) {
      const clip = current();
      if (clip) copy(clip);
    }
    if (event.key === "Delete" && !typing) {
      const clip = current();
      if (clip) remove(clip);
    }
  });

  async function refreshStats() {
    try {
      const stats = await api("/api/stats");
      const kinds = Object.entries(stats.by_kind || {})
        .slice(0, 4)
        .map(([kind, count]) => `${KIND_LABEL[kind] || kind} ${count}`)
        .join(" · ");
      el.stats.innerHTML = `<b>${stats.total}</b> 条 · 置顶 <b>${stats.pinned}</b>`
        + (kinds ? ` &nbsp;|&nbsp; ${kinds}` : "");
    } catch (_) { /* 忽略：统计失败不影响主流程 */ }
  }

  load(true).then(refreshStats);
  setInterval(() => { load(false); refreshStats(); }, 4000);
})();
</script>
</body>
</html>
